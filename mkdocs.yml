site_name: Pyriod

nav:
    - Home: index.md
    - Walkthrough: walkthrough.md

    - Advanced Analyses:
        - Overview: analyses/index.md
        - Using Analysis GUI Tabs: analyses/gui_tabs.md
        - Bootstrap Significance: analyses/bootstrap.md
        - Spectral Window: analyses/spectral_window.md

    - API Reference:
        - Pyriod: api/pyriod.md
        - Prewhitener: api/prewhitener.md
        - PyriodGUI: api/gui.md

  - Developer Guide:
      - Extending Analyses: developer/analyses.md

theme:
  name: readthedocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters:
              - "!^_"